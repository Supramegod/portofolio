server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep any redirect relative, so a non-80 host port (compose maps 8080)
    # survives instead of being rewritten to a bare http://localhost/.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
    gzip_min_length 1024;

    # Mirrors the 301s in public/_redirects. These are the pre-redesign URLs
    # that Search Console already indexed; without them the SPA fallback
    # answers 200 with the homepage shell, which reads as a soft 404.
    location = /about-me {
        return 301 /en/about-me;
    }

    location ~ ^/project/([0-9]+)$ {
        return 301 /en/project/$1;
    }

    # Mirrors public/_headers — Cloudflare Pages forces XML here, so does nginx.
    location = /sitemap.xml {
        add_header Content-Type application/xml;
        add_header X-Robots-Tag "index, follow";
    }

    # Hashed Vite assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Mirrors public/_redirects — SPA fallback for React Router routes.
    #
    # `$uri/index.html` MUST come before `$uri/`: the prerendered pages live at
    # en/index.html, id/project/1/index.html and so on, and matching the
    # directory first makes nginx 301 to a trailing slash. Canonical URLs and
    # the sitemap have no trailing slash, and Cloudflare Pages serves those
    # files without redirecting — so redirecting here would break local parity
    # and point crawlers at a URL that is not the canonical one.
    location / {
        try_files $uri $uri/index.html /index.html;
    }
}
